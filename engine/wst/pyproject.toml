[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12", "cmake>=3.18", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "omni-wst-core"
version = "1.0.4"
license = "AGPL-3.0-or-later"
description = "OmniPulse WST/JTFS C++/CUDA perceptual hashing engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-benchmark"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DCUDA_ARCH=native"]
wheel.packages = ["src/omni_wst_core"]
